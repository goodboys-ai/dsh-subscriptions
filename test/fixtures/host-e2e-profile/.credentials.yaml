# Fake credential refs for the host E2E (scripts/host-e2e.sh). These are not
# provider secrets. The E2E copies this file to $DSH_HOME/.credentials.yaml
# and sets mode 0600; the harness refuses to read a credential file other
# users can open. Process environment wins over this file, so the E2E
# unsets OPENCODE_GO_API_KEY, KIMI_CODING_API_KEY,
# CURSOR_SUBSCRIPTION_OAUTH, MINIMAX_API_KEY, and MINIMAX_CN_API_KEY
# before starting dsh.
version: 1
refs:
  OPENCODE_GO_API_KEY: fake-opencode-key
  KIMI_CODING_API_KEY: fake-kimi-key
  MINIMAX_API_KEY: fake-minimax-key
  CURSOR_SUBSCRIPTION_OAUTH: '{"type":"oauth","access":"fake.eyJzdWIiOiJhdXRoMHx1c2VyX2JhciIsImV4cCI6NDEwMjQ0NDgwMH0.sig","refresh":"fake-cursor-refresh","expires":4102444800000}'
